<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 425" role="img" aria-labelledby="title desc">
<title id="title">Repeating and nonrepeating crossing rhythms</title><desc id="desc">Distances are divided by a. The upper panel combines periods 1 and 1.5, repeating every 3 units. The lower panel combines periods 1 and square root of 2, with no exact repeat. The combined rows retain both shapes at simultaneous crossings.</desc>
