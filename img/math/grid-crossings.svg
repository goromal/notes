<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" role="img" aria-labelledby="title desc">
<title id="title">Two families of cracks, two crossing spacings</title><desc id="desc">A straight path crosses a rectangular grid. Vertical cracks produce blue circular ticks spaced a apart; horizontal cracks produce orange square ticks spaced b apart. Tile width w and height h are marked.</desc>
<rect width="680" height="410" rx="12" fill="#ffffff"/>
<g font-family="system-ui, sans-serif" font-size="16" fill="#182b3a">
<text x="28" y="30" font-size="19" text-anchor="start" fill="#182b3a">A tiled wall, viewed straight on</text>
<line x1="60" y1="50" x2="60" y2="290" stroke="#ced7de" stroke-width="1" />
<line x1="170" y1="50" x2="170" y2="290" stroke="#ced7de" stroke-width="1" />
<line x1="280" y1="50" x2="280" y2="290" stroke="#ced7de" stroke-width="1" />
<line x1="390" y1="50" x2="390" y2="290" stroke="#ced7de" stroke-width="1" />
<line x1="500" y1="50" x2="500" y2="290" stroke="#ced7de" stroke-width="1" />
<line x1="610" y1="50" x2="610" y2="290" stroke="#ced7de" stroke-width="1" />
<line x1="60" y1="50" x2="610" y2="50" stroke="#ced7de" stroke-width="1" />
<line x1="60" y1="130" x2="610" y2="130" stroke="#ced7de" stroke-width="1" />
<line x1="60" y1="210" x2="610" y2="210" stroke="#ced7de" stroke-width="1" />
<line x1="60" y1="290" x2="610" y2="290" stroke="#ced7de" stroke-width="1" />
<line x1="85" y1="280" x2="585" y2="80" stroke="#182b3a" stroke-width="2.5" />
<circle cx="170" cy="246" r="4.5" fill="#1769aa"/>
<circle cx="280" cy="202" r="4.5" fill="#1769aa"/>
<circle cx="390" cy="158" r="4.5" fill="#1769aa"/>
<circle cx="500" cy="114" r="4.5" fill="#1769aa"/>
<rect x="256" y="206" width="8" height="8" fill="#c45b14"/>
<rect x="456" y="126" width="8" height="8" fill="#c45b14"/>
<line x1="280" y1="175" x2="390" y2="131" stroke="#1769aa" stroke-width="1.5" />
<line x1="280" y1="170" x2="280" y2="180" stroke="#1769aa" stroke-width="1.5" />
<line x1="390" y1="126" x2="390" y2="136" stroke="#1769aa" stroke-width="1.5" />
<text x="335" y="146" font-size="20" text-anchor="middle" fill="#1769aa">a</text>
<line x1="260" y1="240" x2="460" y2="160" stroke="#c45b14" stroke-width="1.5" />
<line x1="260" y1="235" x2="260" y2="245" stroke="#c45b14" stroke-width="1.5" />
<line x1="460" y1="155" x2="460" y2="165" stroke="#c45b14" stroke-width="1.5" />
<text x="360" y="219" font-size="20" text-anchor="middle" fill="#c45b14">b</text>
<text x="99" y="304" font-size="14" text-anchor="start" fill="#182b3a">finger path</text>
<line x1="60" y1="328" x2="170" y2="328" stroke="#182b3a" stroke-width="1" />
<line x1="60" y1="323" x2="60" y2="333" stroke="#182b3a" stroke-width="1" />
<line x1="170" y1="323" x2="170" y2="333" stroke="#182b3a" stroke-width="1" />
<text x="115" y="350" font-size="18" text-anchor="middle" fill="#182b3a">w</text>
<line x1="632" y1="210" x2="632" y2="290" stroke="#182b3a" stroke-width="1" />
<line x1="627" y1="210" x2="637" y2="210" stroke="#182b3a" stroke-width="1" />
<line x1="627" y1="290" x2="637" y2="290" stroke="#182b3a" stroke-width="1" />
<text x="644" y="255" font-size="18" text-anchor="start" fill="#182b3a">h</text>
<circle cx="64" cy="383" r="4.5" fill="#1769aa"/>
<text x="78" y="389" font-size="15" text-anchor="start" fill="#1769aa">Vertical cracks</text>
<rect x="300" y="379" width="8" height="8" fill="#c45b14"/>
<text x="318" y="389" font-size="15" text-anchor="start" fill="#c45b14">Horizontal cracks</text>
</g></svg>
